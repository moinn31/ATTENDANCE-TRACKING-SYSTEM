version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules package-lock.json || true
        - npm install --include=optional --no-audit --no-fund --legacy-peer-deps
        - echo "--- npm install diagnostics ---"
        - node -v && npm -v
        - npm ls lightningcss --depth=0 || true
        - npm ls @tailwindcss/oxide --depth=0 || true
        - ls -la node_modules | grep -E "(lightningcss|oxide)" || true
        - node -e "try{console.log('✓ lightningcss found:', require.resolve('lightningcss'))}catch(e){console.log('✗ lightningcss missing')}" || true
        - node -e "try{console.log('✓ oxide found:', require.resolve('@tailwindcss/oxide'))}catch(e){console.log('✗ oxide missing')}" || true
    build:
      commands:
        - npm run build -- --webpack
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
