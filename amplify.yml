version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules || true
        - npm install --include=optional --no-audit --no-fund
        - npm install --no-save lightningcss-linux-x64-gnu@1.31.1 --include=optional
        - npm install --no-save @tailwindcss/oxide-linux-x64-gnu@4.2.1 --include=optional --no-audit --no-fund
        - echo "--- diagnostics ---"
        - node -v
        - npm -v
        - npm ls lightningcss-linux-x64-gnu --depth=0 || true
        - npm ls @tailwindcss/oxide-linux-x64-gnu --depth=0 || true
        - ls -la node_modules | head -n 40 || true
        - ls -la node_modules/lightningcss* || true
        - node -e "try{console.log('resolve lightningcss:', require.resolve('lightningcss-linux-x64-gnu'))}catch(e){console.log('resolve-lightningcss-failed')}; try{console.log('resolve oxide:', require.resolve('@tailwindcss/oxide-linux-x64-gnu'))}catch(e){console.log('resolve-oxide-failed')}"
    build:
      commands:
        - npm run build -- --webpack
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*