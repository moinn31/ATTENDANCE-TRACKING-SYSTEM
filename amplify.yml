version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules package-lock.json || true
        - npm ci --include=optional
        - npm install --no-save lightningcss-linux-x64-gnu@1.31.1 --include=optional
    build:
      commands:
        - npm run build -- --webpack
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*